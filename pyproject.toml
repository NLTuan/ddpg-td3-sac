[project]
name = "ddpg-td3-sac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
]

[project.optional-dependencies]
cpu = ["torch", "torchvision", "torchaudio"]
gpu = ["torch", "torchvision", "torchaudio"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu124", marker = "extra == 'gpu' and extra != 'cpu'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu124", marker = "extra == 'gpu' and extra != 'cpu'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu124", marker = "extra == 'gpu' and extra != 'cpu'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
